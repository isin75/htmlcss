<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
	</head>
	<body>
		<header>
			<nav><a href="hw.html">navigation</a></nav>
		</header>
		<main>
			<section>
				<article>
					<h2>Content tag</h2>
					<img
						src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3e/HTML5_logo_and_wordmark.svg/1200px-HTML5_logo_and_wordmark.svg.png"
						alt="HTML5 logo"
						width="200"
						height="200"
					/>
					<audio controls>
						<source
							src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
							type="audio/mpeg"
						/>
						Your browser does not support the audio element.
					</audio>
					<video width="320" height="240" controls>
						<source
							src="https://www.w3schools.com/html/mov_bbb.mp4"
							type="video/mp4"
						/>
						Your browser does not support the video tag.
					</video>
					<iframe
						width="560"
						height="315"
						src="https://www.youtube.com/embed/-sNWKbnaFkg?si=F6GuBOccYeZxhjyu"
						title="YouTube video player"
						frameborder="0"
						allow="
							accelerometer;
							autoplay;
							clipboard-write;
							encrypted-media;
							gyroscope;
							picture-in-picture;
							web-share;
						"
						referrerpolicy="strict-origin-when-cross-origin"
						allowfullscreen
					></iframe>
				</article>
			</section>
			<aside>sidebar</aside>
		</main>
		<footer>footer</footer>
	</body>
</html>
