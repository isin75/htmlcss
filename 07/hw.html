<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="hw.css" />
		<title>Document</title>
	</head>
	<body>
		<div class="container">
			<header class="header">
				<button class="header__button">
					<img
						class="header__button-img"
						src="img/Vector.jpg"
						alt="Menu button"
					/>
				</button>
				<h1 class="header__title">Menu</h1>
			</header>
			<main class="main">
				<form action="#" class="main__form">
					<input
						class="main__search"
						type="text"
						placeholder="Search food here"
					/>
				</form>
				<section class="category">
					<!-- food categories -->
					<div class="category-item">
						<div class="category-item__img-container">
							<img
								class="category-item__img"
								src="img/image 4.png"
								alt="Burger"
							/>
						</div>
						<h4 class="category-item__title">Food</h4>
					</div>
					<!--  -->
					<!-- drinks categories -->
					<div class="category-item">
						<div class="category-item__img-container">
							<img
								class="category-item__img"
								src="img/emojione_tropical-drink.png"
								alt="Drinks"
							/>
						</div>
						<h4 class="category-item__title">Food</h4>
					</div>
					<!--  -->
					<!-- desserts categories -->
					<div class="category-item">
						<div class="category-item__img-container">
							<img
								class="category-item__img"
								src="img/Group 5.png"
								alt="Dessert"
							/>
						</div>
						<h4 class="category-item__title">Food</h4>
					</div>
					<!--  -->
				</section>

				<!-- Position section -->
				<section class="food-position">
					<h3 class="food-position__title">Burger</h3>
					<!-- Big Mac -->
					<div class="food-position__item">
						<img
							class="food-position__img"
							src="img/5882482de81acb96424ffaac 1.png"
							alt="Big Mac"
						/>
						<p class="position__description">
							<span class="position__title">Big Mac</span
							><span class="position__price">Rs 240</span>
						</p>
					</div>
					<!--  -->
					<!-- Kfc double -->
					<div class="food-position__item">
						<img
							class="food-position__img"
							src="img/590607a10cbeef0acff9a646 1.png"
							alt="KFC Double"
						/>
						<p class="position__description">
							<span class="position__title">KFC Double</span
							><span class="position__price">Rs 252</span>
						</p>
					</div>
					<!--  -->
					<!-- Fish burger -->
					<div class="food-position__item">
						<img
							class="food-position__img"
							src="img/58824b29e81acb96424ffab8 1.png"
							alt="Fish Burger"
						/>
						<p class="position__description">
							<span class="position__title">Fish Burger</span
							><span class="position__price">Rs 220</span>
						</p>
					</div>
					<!--  -->
				</section>
			</main>
		</div>
	</body>
</html>
