<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="hw.css" />
		<title>Document</title>
	</head>
	<body>
		<!-- dija -->
		<div class="dija">
			<img class="dija__title" src="img/Vector.png" alt="Дія" />
			<div class="dija__flag">
				<div class="dija__flag_blue"></div>
				<div class="dija__flag_yellow"></div>
			</div>
		</div>
		<!-- Ukrain flag rectangle -->
		<div class="flag-rectangle__background_yellow">
			<!-- in the absence of an image -->
			<div class="flag-rectangle__background_blue"></div>
			<!--  -->
			<div class="flag-rectangle__img-container">
				<img
					class="flag-rectangle__img-container_blue"
					src="img/Blue.png"
					alt="blue color"
				/>
				<img
					class="flag-rectangle__img-container_glyph"
					src="img/Glyph.png"
					alt="glyph"
				/>
			</div>
		</div>
		<!-- Ukrain flag circle -->
		<div class="flag-circle__background_white">
			<div class="flag-circle__background_yellow">
				<!-- in the absence of an image -->
				<div class="flag-circle__background_blue"></div>
				<!--  -->
				<img
					class="flag-circle__img_blue"
					src="img/Blue.png"
					alt="blue color"
				/>
				<img class="flag-circle__img_glyph" src="img/Glyph.png" alt="glyph" />
			</div>
		</div>
	</body>
</html>
