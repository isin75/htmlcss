<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="reset.css" />
		<link rel="stylesheet" href="hw.css" />
		<title>Document</title>
	</head>
	<body>

		<section class="section-text">
			<h1 class="section-text__title">
				<strong class="section-text__title_bold">Best Developers</strong> On The
				Planet
			</h1>
			<p class="section-text__paragraph">
				This Product integrates with your favorite apps to automate workflows
				and</br>ensure smooth, productive work days.
			</p>
		</section>

    <!-- Cards -->

		<section class="developers-cards">
      <!-- Dan Burykin -->
			<div class="developers-cards__card">
				<div class="developers-cards__photo-container">
          <img class="developers-cards__photo" src="img/photo/af001ae58609c31c923f656dfca467973b181cc3.png" alt="Dan Burykin photo" />
        </div>
        <div class="developers-cards__text-container">
			 <h4 class="developers-cards__text-container_name">Dan Burykin</h4>
       <p class="developers-cards__text-container_position">Vue.JS Developer</p>
       </div>
				<div class="developers-cards__stack-container">
          <div class="developers-cards__stack vue-js"><img class="developers-cards__stack_img" src="img/icon/V.png" alt="VueJs"></div>
        </div>
			</div>

      <!-- Esi Doda -->

      <div class="developers-cards__card">
				<div class="developers-cards__photo-container">
          <img class="developers-cards__photo" src="img/photo/edd13cd836eb234a4ddf51d2742ac5ff5842653c.png" alt="Esi Doda photo" />
        </div>
        <div class="developers-cards__text-container">
			 <h4 class="developers-cards__text-container_name">Esi Doda</h4>
       <p class="developers-cards__text-container_position">Software Developer</p>
       </div>
				<div class="developers-cards__stack-container">
          <div class="developers-cards__stack angular">
            <img class="developers-cards__stack_img" src="img/icon/Just Logo.png" alt="Angular">
          </div>
          <div class="developers-cards__stack flutter">
            <img class="developers-cards__stack_img" src="img/icon/Flutter.png" alt="Flutter">
          </div>
          <div class="developers-cards__stack react">
            <img class="developers-cards__stack_img" src="img/icon/react.png" alt="React">
          </div>
        </div>
			</div>

      <!-- Alex Harper -->

      <div class="developers-cards__card">
				<div class="developers-cards__photo-container">
          <img class="developers-cards__photo" src="img/photo/e7131945cb4c22ac06a99f88b441eb31b56913eb.jpg" alt="Alex Harper photo" />
        </div>
        <div class="developers-cards__text-container">
			 <h4 class="developers-cards__text-container_name">Alex Harper</h4>
       <p class="developers-cards__text-container_position">RN Executive</p>
       </div>
				<div class="developers-cards__stack-container">
          <div class="developers-cards__stack java"><img class="developers-cards__stack_img" src="img/icon/JAVA.png" alt="Java">
          </div>
          <div class="developers-cards__stack react"><img class="developers-cards__stack_img" src="img/icon/react.png" alt="React">
          </div>
        </div>
			</div>

      <!-- Amarna Miller -->

      <div class="developers-cards__card">
				<div class="developers-cards__photo-container">
          <img class="developers-cards__photo" src="img/photo/7810d5e5262678a6239bb1d4645a047d2ffe1dbf.jpg" alt="Amarna Miller photo" />
        </div>
        <div class="developers-cards__text-container">
			 <h4 class="developers-cards__text-container_name">Amarna Miller</h4>
       <p class="developers-cards__text-container_position">Frontend Wizard</p>
       </div>
				<div class="developers-cards__stack-container">
          <div class="developers-cards__stack html"><img class="developers-cards__stack_img" src="img/icon/HTML.png" alt="HTML"></div>
          <div class="developers-cards__stack css"><img class="developers-cards__stack_img" src="img/icon/CSS.png" alt="CSS"></div>
        </div>
			</div>
		</section>
	</body>
</html>
