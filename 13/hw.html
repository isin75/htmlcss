<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="style/reset.css" />
		<link rel="stylesheet" href="style/hw.css" />
		<title>WH</title>
	</head>
	<body>
		<header class="header width">
			<h3 class="header__logo onHower">Room.us</h3>
			<nav class="header__nav">
				<div class="header__nav_left">
					<button class="header__nav_home onHower" autofocus>Home</button>
					<button class="header__nav_amenities onHower">Amenities</button>
					<button class="header__nav_contact-us onHower">Contact Us</button>
				</div>
				<div class="header__nav_right">
					<button class="header__nav_category onHower">Category</button>
					<button class="header__nav_search">
						<img src="img/search.svg" alt="search_icon" />
					</button>
				</div>
			</nav>
		</header>

		<main class="main width">
			<img class="main_plus-icon" src="img/plus-icon.svg" alt="plus_icon" />
			<!-- Photo -->
			<div class="main__img-container">
				<img
					class="main__img-container_img"
					src="img/Rectangle 168.png"
					alt="photo"
				/>
			</div>
			<!-- Text -->
			<section class="main__text">
				<h5 class="main__section-title">Work Space</h5>
				<h1 class="main__title">Modern Design work space</h1>
				<div class="main__line"></div>
				<p class="main__description">
					Lorem ipsum dolor sit amet, consectetur adipiscing elit ut aliquam,
					purus sit amet luctus venenatis, lectus magna fringilla urna,
					porttitor rhoncus dolor purus non enim
				</p>
				<div href="#" class="main__video-link onHower">
					<div class="main__video-icon_container">
						<img
							class="main__video-icon"
							src="img/play-icon.png"
							alt="play_icon"
						/>
					</div>
					Watch Video
				</div>
			</section>

			<!-- Social Links -->
			<div class="main__social-link_container">
				<div class="main__social-link_line"></div>
        <div class="main__social-link_icon-container">
          <a class="main__social-link_icon-link" href="#">
          <img
            class="main__social-link_icon"
            src="img/twitter.png"
            alt="twitter_icon"
          />
					<img
            class="main__social-link_icon-hover"
            src="img/Vector.png"
            alt="twitter_icon"
          />
          </a>
          <a class="main__social-link_icon-link" href="#">
          <img
            class="main__social-link_icon"
            src="img/instagram.png"
            alt="instagram_icon"
          />
					<img
            class="main__social-link_icon-hover"
            src="img/instagram-hover.png"
            alt="instagram_icon"
          />
          </a>
          <a class="main__social-link_icon-link" href="#">
						<img
            class="main__social-link_icon"
            src="img/fb.png"
            alt="facebook_icon"
						/>
						<img
						class="main__social-link_icon-hover"
						src="img/facebook-hover.png"
						alt="facebook_icon"
					/>
					</a>
			</div>
		</main>
		<footer class="footer">
      <div class="footer__client-photo_container position-absolute-first">
        <img class="footer__client-photo" src="img/b15871be0d25b0aaa6b8ae830f723adb68476412.jpg" alt="Client photo">
			</div>
      <div class="footer__client-photo_container position-absolute-second">
				<img class="footer__client-photo"src="img/485852a530e3a5cc2f8ba44837f55015a149207e.jpg" alt="Client photo">
			</div>
      <div class="footer__client-photo_container position-absolute-third">
				<img class="footer__client-photo" src="img/7697c967e4f0028e44b9f0ca70b92fcb24ee1717.jpg" alt="Client photo">
			</div>
			<p class="footer__client-count"><strong>235+</strong> Client</p>
    </footer>
	</body>
</html>
